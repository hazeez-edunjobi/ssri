name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==1.8.5
      - name: Install dependencies
        run: poetry install --no-ansi
      - name: Ruff
        run: poetry run ruff check src tests
      - name: Unit tests
        run: poetry run pytest -q --tb=short
      - name: Compose config validation
        run: |
          cp ../.env.example ../.env
          docker compose -f ../infra/docker-compose.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # next lint was removed in Next.js 16; typecheck + build remain the gate
  docker:
    runs-on: ubuntu-latest
    needs: [model]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build API/worker image
        run: docker compose -f infra/docker-compose.yml build api
      - name: Compose up core services
        run: docker compose -f infra/docker-compose.yml up -d postgres redis api worker
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 5
          done
          docker compose -f infra/docker-compose.yml logs api worker --tail=80
          exit 1
      - name: Ready check
        run: curl -fsS http://127.0.0.1:8000/api/v1/ready | tee /tmp/ready.json
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
