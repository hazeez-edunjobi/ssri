name: ssri

services:
  postgres:
    image: postgres:16-alpine
    container_name: ssri-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ssri}
      POSTGRES_USER: ${POSTGRES_USER:-ssri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ssri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ssri-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ssri-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../model
      dockerfile: Dockerfile
    container_name: ssri-api
    command: ["api"]
    env_file:
      - ../.env
    environment:
      SSRI_API_HOST: 0.0.0.0
      SSRI_API_PORT: 8000
      SSRI_API_ENVIRONMENT: ${SSRI_API_ENVIRONMENT:-development}
      SSRI_EXECUTION_MODE: ${SSRI_EXECUTION_MODE:-distributed}
      SSRI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssri}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-ssri}
      SSRI_REDIS_URL: redis://redis:6379/0
      SSRI_CELERY_BROKER_URL: redis://redis:6379/0
      SSRI_CELERY_RESULT_BACKEND: redis://redis:6379/0
      SSRI_API_OUTPUT_ROOT: /data/outputs
      SSRI_AUTH_KEY_STORE: /data/auth/keys.json
      SSRI_OBJECT_STORAGE_BACKEND: ${SSRI_OBJECT_STORAGE_BACKEND:-local}
      SSRI_OBJECT_STORAGE_ROOT: ${SSRI_OBJECT_STORAGE_ROOT:-/data/outputs/objects}
      SSRI_OBJECT_STORAGE_BUCKET: ${SSRI_OBJECT_STORAGE_BUCKET:-}
      SSRI_OBJECT_STORAGE_ENDPOINT: ${SSRI_OBJECT_STORAGE_ENDPOINT:-}
      SSRI_OBJECT_STORAGE_REGION: ${SSRI_OBJECT_STORAGE_REGION:-us-east-1}
      SSRI_OBJECT_STORAGE_ACCESS_KEY: ${SSRI_OBJECT_STORAGE_ACCESS_KEY:-}
      SSRI_OBJECT_STORAGE_SECRET_KEY: ${SSRI_OBJECT_STORAGE_SECRET_KEY:-}
      SSRI_OBJECT_STORAGE_PUBLIC_BASE_URL: ${SSRI_OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      SSRI_OBJECT_STORAGE_URL_EXPIRES: ${SSRI_OBJECT_STORAGE_URL_EXPIRES:-3600}
      # Container-native paths only. Do NOT interpolate host GRAVITY_DATA_PATH —
      # a Windows host path breaks Linux containers even when the volume is mounted.
      GRAVITY_DATA_PATH: /data/geophysics/processed/lagos_gravity_wgm2012_bouguer.tif
      MAGNETIC_DATA_PATH: /data/geophysics/processed/lagos_magnetic_emag2v3_uc4km.tif
      SSRI_GRAVITY_SOURCE: ${SSRI_GRAVITY_SOURCE:-wgm2012_bouguer}
      SSRI_DATA_ROOT: /data
      SSRI_LIVE_ACQUISITION_ENABLED: ${SSRI_LIVE_ACQUISITION_ENABLED:-false}
      # Do not set OPENTOPOGRAPHY_API_KEY here — empty ${VAR:-} interpolation from
      # infra/.env absence overrides env_file: ../.env and blanks the secret.
      # Key comes from env_file (../.env). DEM defaults: auto → OpenTopo then GEE.
      SSRI_OPENTOPO_MIN_BBOX_SIDE_M: ${SSRI_OPENTOPO_MIN_BBOX_SIDE_M:-500}
      SSRI_DEM_PROVIDER: auto
      GEE_PRIVATE_KEY_PATH: /credentials/earth-engine.json
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/earth-engine.json
      GCP_PROJECT_ID: ${GEE_PROJECT:-${GCP_PROJECT_ID:-}}
    volumes:
      - ssri_data:/data
      - ../data/geophysics:/data/geophysics:ro
      - ../credentials:/credentials:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssri-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    build:
      context: ../model
      dockerfile: Dockerfile
    container_name: ssri-worker
    command: ["worker"]
    env_file:
      - ../.env
    environment:
      SSRI_API_ENVIRONMENT: ${SSRI_API_ENVIRONMENT:-development}
      SSRI_EXECUTION_MODE: distributed
      SSRI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssri}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-ssri}
      SSRI_REDIS_URL: redis://redis:6379/0
      SSRI_CELERY_BROKER_URL: redis://redis:6379/0
      SSRI_CELERY_RESULT_BACKEND: redis://redis:6379/0
      SSRI_API_OUTPUT_ROOT: /data/outputs
      SSRI_AUTH_KEY_STORE: /data/auth/keys.json
      SSRI_CELERY_CONCURRENCY: ${SSRI_CELERY_CONCURRENCY:-1}
      SSRI_OBJECT_STORAGE_BACKEND: ${SSRI_OBJECT_STORAGE_BACKEND:-local}
      SSRI_OBJECT_STORAGE_ROOT: ${SSRI_OBJECT_STORAGE_ROOT:-/data/outputs/objects}
      SSRI_OBJECT_STORAGE_BUCKET: ${SSRI_OBJECT_STORAGE_BUCKET:-}
      SSRI_OBJECT_STORAGE_ENDPOINT: ${SSRI_OBJECT_STORAGE_ENDPOINT:-}
      SSRI_OBJECT_STORAGE_REGION: ${SSRI_OBJECT_STORAGE_REGION:-us-east-1}
      SSRI_OBJECT_STORAGE_ACCESS_KEY: ${SSRI_OBJECT_STORAGE_ACCESS_KEY:-}
      SSRI_OBJECT_STORAGE_SECRET_KEY: ${SSRI_OBJECT_STORAGE_SECRET_KEY:-}
      SSRI_OBJECT_STORAGE_PUBLIC_BASE_URL: ${SSRI_OBJECT_STORAGE_PUBLIC_BASE_URL:-}
      SSRI_OBJECT_STORAGE_URL_EXPIRES: ${SSRI_OBJECT_STORAGE_URL_EXPIRES:-3600}
      # Container-native paths only. Do NOT interpolate host GRAVITY_DATA_PATH —
      # a Windows host path breaks Linux containers even when the volume is mounted.
      GRAVITY_DATA_PATH: /data/geophysics/processed/lagos_gravity_wgm2012_bouguer.tif
      MAGNETIC_DATA_PATH: /data/geophysics/processed/lagos_magnetic_emag2v3_uc4km.tif
      SSRI_GRAVITY_SOURCE: ${SSRI_GRAVITY_SOURCE:-wgm2012_bouguer}
      SSRI_DATA_ROOT: /data
      SSRI_LIVE_ACQUISITION_ENABLED: ${SSRI_LIVE_ACQUISITION_ENABLED:-false}
      # Do not set OPENTOPOGRAPHY_API_KEY here — empty interpolation overrides env_file.
      SSRI_OPENTOPO_MIN_BBOX_SIDE_M: ${SSRI_OPENTOPO_MIN_BBOX_SIDE_M:-500}
      SSRI_DEM_PROVIDER: auto
      GEE_PRIVATE_KEY_PATH: /credentials/earth-engine.json
      GOOGLE_APPLICATION_CREDENTIALS: /credentials/earth-engine.json
      GCP_PROJECT_ID: ${GEE_PROJECT:-${GCP_PROJECT_ID:-}}
    volumes:
      - ssri_data:/data
      - ../data/geophysics:/data/geophysics:ro
      - ../credentials:/credentials:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ssri-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -m ssri_model.worker.health",
        ]
      interval: 30s
      timeout: 25s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  recovery:
    build:
      context: ../model
      dockerfile: Dockerfile
    container_name: ssri-recovery
    command: ["recovery"]
    profiles: ["recovery"]
    env_file:
      - ../.env
    environment:
      SSRI_EXECUTION_MODE: distributed
      SSRI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ssri}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-ssri}
      SSRI_REDIS_URL: redis://redis:6379/0
      SSRI_CELERY_BROKER_URL: redis://redis:6379/0
      SSRI_LEASE_RECOVERY_ENABLED: "true"
      SSRI_LEASE_RECOVERY_INTERVAL_SECONDS: ${SSRI_LEASE_RECOVERY_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssri-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ssri-frontend
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ssri-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: ssri-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ssri_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ssri_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - ssri-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  ssri-network:
    name: ssri-network
    driver: bridge

volumes:
  postgres_data:
    name: ssri-postgres-data
  redis_data:
    name: ssri-redis-data
  ssri_data:
    name: ssri-app-data
  minio_data:
    name: ssri-minio-data
